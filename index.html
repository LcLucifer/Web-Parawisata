<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Pariwisata Indonesia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }
        header {
            background: #1e88e5;
            color: white;
            padding: 16px;
            text-align: center;
        }
        section {
            padding: 20px;
            background: white;
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: none;
        }
        h2 { color: #333; }
        iframe { width: 100%; height: 520px; border: none; }
        img { width: 100%; max-width: 1000px; display: block; margin: auto; }
        .btn-group { text-align: center; margin: 20px; }
        button {
            background: #1e88e5;
            color: white;
            border: none;
            padding: 10px 16px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #1565c0; }
        footer {
            background: #ddd;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>🌏 Web Pariwisata Indonesia</h1>
    <p>Data Scrapping, Peta GIS & Grafik Pariwisata</p>
</header>

<div class="btn-group">
    <button onclick="toggleSection('data')">📋 Data Wisata</button>
    <button onclick="toggleSection('peta')">🗺️ Peta GIS</button>
    <button onclick="toggleSection('grafik')">📊 Grafik</button>
</div>

<section id="data">
    <h2>📋 Data Tempat Wisata (Hasil Scrapping)</h2>
    <iframe src="data_wisata.html" style="height:400px"></iframe>
</section>

<section id="peta">
    <h2>🗺️ Peta Lokasi Pariwisata</h2>
    <iframe src="gis_kategori.html"></iframe>
</section>

<section id="grafik">
    <h2>📊 Grafik Data Pariwisata</h2>
    <img src="grafik_pariwisata.png" alt="Grafik Pariwisata Indonesia">
</section>

<footer>
    © 2026 - Web Pariwisata Indonesia
</footer>

<script>
function toggleSection(id) {
    const sections = ['data', 'peta', 'grafik'];
    sections.forEach(sec => {
        const el = document.getElementById(sec);
        if (sec === id) {
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        } else {
            el.style.display = 'none';
        }
    });
}
</script>

</body>
</html>
